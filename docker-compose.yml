services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asklio
      POSTGRES_PASSWORD: asklio
      POSTGRES_DB: asklio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asklio -d asklio"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://asklio:asklio@db:5432/asklio
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CORS_ORIGINS: http://localhost:3200
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7200:7200"

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time; the browser calls the
        # backend directly, so this must be reachable from the host.
        NEXT_PUBLIC_API_URL: http://localhost:7200
    environment:
      PORT: 3200
    depends_on:
      - backend
    ports:
      - "3200:3200"

volumes:
  postgres_data:
